services:
  postgres:
    image: postgres:16-alpine
    container_name: demo1-postgres
    environment:
      POSTGRES_DB: demo1
      POSTGRES_USER: demo1
      POSTGRES_PASSWORD: demo1
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo1 -d demo1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: